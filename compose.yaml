services:
  gta-roadmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gta5online-roadmap
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
