name: OpenShip CI Pipeline

# Trigger via manual dispatch (OpenShip Actions runner)
on:
  workflow_dispatch:
    inputs:
      skip_container_build:
        description: 'Skip container build preflight'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis & TypeScript Typecheck
  # -------------------------------------------------------------
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: [self-hosted, openship, linux]
    steps:
      - name: Checkout repository
        run: |
          echo "Cloning repository..."
          git clone --depth 1 -b dev-agy https://github.com/gabrielcruzg3/gta5online-roadmap.git .

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  # -------------------------------------------------------------
  # Job 2: Production Bundle Compilation
  # -------------------------------------------------------------
  build-spa:
    name: Build Production SPA
    needs: [typecheck]
    runs-on: [self-hosted, openship, linux]
    steps:
      - name: Checkout repository
        run: |
          echo "Cloning repository..."
          git clone --depth 1 -b dev-agy https://github.com/gabrielcruzg3/gta5online-roadmap.git .

      - name: Install dependencies
        run: npm ci

      - name: Compile Vite bundle
        run: npm run build

      - name: Verify build outputs integrity
        run: |
          echo "Verifying SPA dist artifacts..."
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets missing"; exit 1; }
          echo "Build integrity verified successfully."

  # -------------------------------------------------------------
  # Job 3: SRE Deployment via Docker Compose & AutoKuma
  # -------------------------------------------------------------
  deploy-compose:
    name: Deploy via Docker Compose (with AutoKuma)
    needs: [build-spa]
    runs-on: [self-hosted, openship, linux]
    steps:
      - name: Checkout repository
        run: |
          echo "Cloning repository..."
          git clone --depth 1 -b dev-agy https://github.com/gabrielcruzg3/gta5online-roadmap.git .

      - name: Deploy container with Compose & AutoKuma Labels
        run: |
          echo "Validating Compose definition..."
          docker compose -f compose.yaml config --quiet
          echo "Starting service via Docker Compose..."
          docker compose -f compose.yaml up -d --build --remove-orphans

      - name: Verify Health & Port Readiness
        run: |
          echo "Waiting for service to be healthy on port 3000..."
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "GTA 5 Online Roadmap is LIVE and healthy on http://127.0.0.1:3000"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Service did not respond on port 3000 within 30s"
          docker compose -f compose.yaml logs --tail 30
          exit 1
