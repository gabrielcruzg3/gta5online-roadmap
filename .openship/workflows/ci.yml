name: OpenShip CI Pipeline

# Trigger on push, pull request, and manual dispatch
on:
  push:
    branches:
      - main
      - dev-agy
  pull_request:
    branches:
      - main
      - dev-agy
  workflow_dispatch:
    inputs:
      skip_container_build:
        description: 'Skip container build preflight'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis & TypeScript Typecheck
  # -------------------------------------------------------------
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: [self-hosted, openship, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  # -------------------------------------------------------------
  # Job 2: Production Bundle Compilation
  # -------------------------------------------------------------
  build-spa:
    name: Build Production SPA
    needs: [typecheck]
    runs-on: [self-hosted, openship, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Vite bundle
        run: npm run build

      - name: Verify build outputs integrity
        run: |
          echo "Verifying SPA dist artifacts..."
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets missing"; exit 1; }
          echo "Build integrity verified successfully."

  # -------------------------------------------------------------
  # Job 3: Multi-Stage Docker Container Preflight
  # -------------------------------------------------------------
  container-preflight:
    name: Docker Container Preflight
    needs: [build-spa]
    runs-on: [self-hosted, openship, linux]
    if: ${{ !inputs.skip_container_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate multi-stage Docker build
        run: |
          echo "Building Docker container image for preflight..."
          docker build --tag gta5online-roadmap:ci-test .
          echo "Container build completed successfully."
