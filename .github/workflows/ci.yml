name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev-agy
  pull_request:
    branches:
      - main
      - dev-agy
  workflow_dispatch:
    inputs:
      skip_container_build:
        description: 'Skip container build preflight'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  build-spa:
    name: Build Production SPA
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Vite bundle
        run: npm run build

      - name: Verify build outputs integrity
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets missing"; exit 1; }
          echo "Build integrity verified successfully."

  container-preflight:
    name: Docker Container Preflight
    needs: [build-spa]
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_container_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image preflight
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gta5online-roadmap:ci-test
